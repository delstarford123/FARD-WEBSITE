<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- SEO & Open Graph Tags -->
    <title>{% block title %}FARD | Food, Artificial Intelligence Research & Development{% endblock %}</title>
    <meta name="description" content="FARD: FOOD, ARTIFICIAL INTELLIGENCE, RESEARCH FOR COMMUNITY DEVELOPMENT. Empowering rural communities through sustainable technology and smart agriculture.">
    <meta name="keywords" content="AI Agriculture, FARD, Smart Farming Kenya, Community Development, Agroecology, Food Security AI">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:title" content="FARD - Food, Artificial Intelligence Research & Development">
    <meta property="og:description" content="FOOD, ARTIFICIAL INTELLIGENCE, RESEARCH FOR COMMUNITY DEVELOPMENT. Bridging the gap between technology and sustainable grassroots impact.">
    <meta property="og:image" content="{{ url_for('static', filename='images/branding/FINAL BEST LOGO.png', _external=True) }}">
    <meta property="og:site_name" content="FARD">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ request.url }}">
    <meta name="twitter:title" content="FARD | AI Research for Community Development">
    <meta name="twitter:description" content="FOOD, ARTIFICIAL INTELLIGENCE, RESEARCH FOR COMMUNITY DEVELOPMENT. Innovating for a sustainable future.">
    <meta name="twitter:image" content="{{ url_for('static', filename='images/branding/FINAL BEST LOGO.png', _external=True) }}">

    <!-- Tailwind CSS (CDN for Draft) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#14532D', // Primary Agri
                        leaf: '#22C55E',   // Success/Icons
                        cyber: '#1E3A8A',  // Tech Trust
                        tech: '#06B6D4',   // AI Accents
                        amber: '#F59E0B',  // CTA/Impact
                        soil: '#78350F',   // Agri Borders
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Alpine.js for lightweight interactivity (Mobile menus, tabs) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="bg-white text-slate-900 font-sans antialiased selection:bg-forest/10 selection:text-forest">

    <!-- Skip to Content Link (a11y) -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:p-4 focus:bg-white focus:text-forest border-b-2 border-leaf">
        Skip to content
    </a>

    <!-- Header / Navigation -->
    <header class="sticky top-0 z-40 w-full glass border-b border-slate-200">
        {% include 'components/_navbar.html' %}
    </header>

    <!-- Main Content Area -->
    <main id="main-content" role="main" class="min-h-screen">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'components/_footer.html' %}

    <!-- Common Scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
