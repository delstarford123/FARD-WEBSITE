{% macro leadership_card(name, role, bio, image_url, linkedin='#') %}
<div class="group bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-lg hover:shadow-xl transition-all duration-500 transform hover:-translate-y-2 flex flex-col h-full">
    <!-- Image Container -->
    <div class="relative h-96 overflow-hidden shrink-0">
        <img src="{{ image_url }}" 
             alt="Portrait of {{ name }}, {{ role }} at FARD" 
             class="w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-110"
             loading="lazy">
        <div class="absolute inset-0 bg-gradient-to-t from-forest/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-end p-6">
            <a href="{{ linkedin }}" target="_blank" rel="noopener noreferrer" class="bg-tech p-2 rounded-full text-white hover:bg-tech/80 transition-colors shadow-lg" aria-label="{{ name }}'s LinkedIn Profile">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            </a>
        </div>
    </div>
    
    <!-- Content -->
    <div class="p-8 flex-grow flex flex-col">
        <h3 class="text-slate-900 font-bold text-xl mb-1 group-hover:text-forest transition-colors">{{ name }}</h3>
        <p class="text-forest font-semibold text-sm uppercase tracking-wider mb-4">{{ role }}</p>
        <p class="text-slate-600 text-sm leading-relaxed line-clamp-3 group-hover:line-clamp-none transition-all duration-500 mt-auto">
            {{ bio }}
        </p>
    </div>
</div>
{% endmacro %}
